name: 💡 Feature Request
description: Suggest an idea or module enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have a feature request or module idea? Please fill out the form below.
  - type: dropdown
    id: module
    attributes:
      label: Target Module
      description: Which module should this feature belong to?
      options:
        - ":core / :core-android"
        - ":designsystem"
        - ":analytics / :analytics-api"
        - ":notifications / :notifications-api"
        - ":remote-config / :remote-config-api"
        - ":billing / :billing-api"
        - ":security / :security-platform"
        - ":identity"
        - ":about / :feedback / :rating"
        - ":coupons / :updates / :more-apps"
        - ":consent / :onboarding / :settings / :widgets"
        - "New Module Proposal"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
