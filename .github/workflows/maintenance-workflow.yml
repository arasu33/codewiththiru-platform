name: Maintenance Branch Release & Validation

on:
  push:
    branches: [ 'release/1.0.x' ]

permissions:
  contents: write
  packages: write

jobs:
  validate-and-publish:
    name: Validate & Publish Patches
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Checks
        run: ./gradlew lintDebug testDebugUnitTest assembleRelease detekt ktlintCheck

      - name: Run Binary Compatibility Checks
        run: ./gradlew apiCheck

