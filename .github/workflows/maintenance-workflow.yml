name: Maintenance Branch Release & Validation

on:
  push:
    branches: [ 'release/1.0.x' ]

permissions:
  contents: write
  packages: write

jobs:
  # ── Job 1: Lint & Static Analysis (parallel) ──────────────────────────
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Lint & Detekt
        run: ./gradlew detekt ktlintCheck --no-daemon

  # ── Job 2: Tests & API Check (parallel) ────────────────────────────────
  test:
    name: Tests & API Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Tests & API Check
        run: ./gradlew testDebugUnitTest assembleRelease apiCheck --no-daemon
