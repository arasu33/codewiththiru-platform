name: Prod Release & Publish

on:
  push:
    branches: [ prod ]

permissions:
  contents: write
  packages: write

jobs:
  # ── Job 1: Lint & Static Analysis (parallel) ──────────────────────────
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Lint & Detekt
        run: ./gradlew detekt ktlintCheck --no-daemon

  # ── Job 2: Tests & API Check (parallel) ────────────────────────────────
  verify:
    name: Verify Project (${{ matrix.task }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [testDebugUnitTest, apiCheck]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run ${{ matrix.task }}
        run: ./gradlew ${{ matrix.task }} --no-daemon

  # ── Job 3: Build & Finalize (depends on lint + test) ───────────────────
  finalize:
    name: Build & Finalize
    runs-on: ubuntu-latest
    needs: [lint, verify]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Assemble Release
        run: ./gradlew assembleRelease --no-daemon

      - name: Auto-Update README Version
        run: |
          VERSION=$(grep -E '^PLATFORM_VERSION_NAME=' gradle.properties | cut -d '=' -f 2)
          sed -i -E "s/## Version: v[0-9]+\.[0-9]+\.[0-9]+/## Version: v$VERSION/" README.md
          sed -i -E "s/platform-bom:[0-9]+\.[0-9]+\.[0-9]+/platform-bom:$VERSION/" README.md

      - name: Commit README Update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-sync version in README [skip ci]"
          branch: prod
          file_pattern: "README.md"
