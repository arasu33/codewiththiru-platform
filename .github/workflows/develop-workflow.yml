name: Dev Branch Validation & Auto-Format

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: write

jobs:
  # ── Job 1: Auto-Format (must run first, may commit) ────────────────────
  format:
    name: Auto-Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Ktlint Auto-Format
        run: ./gradlew ktlintFormat --no-daemon

      - name: Auto-Commit Formatted Code
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format code with ktlint [skip ci]"
          branch: ${{ github.head_ref || github.ref_name }}
          file_pattern: "**/*.kt **/*.kts"

  # ── Job 2: Lint & Static Analysis (parallel with tests) ───────────────
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    needs: [format]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Detekt & Dependency Analysis
        run: ./gradlew detekt buildHealth --no-daemon

  # ── Job 3: Tests & Build (parallel with lint) ─────────────────────────
  test:
    name: Tests & Build
    runs-on: ubuntu-latest
    needs: [format]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Tests, Build & API Check
        run: ./gradlew testDebugUnitTest assembleDebug apiCheck --no-daemon
