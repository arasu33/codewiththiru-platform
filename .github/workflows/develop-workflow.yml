name: Dev Branch Validation & Auto-Format

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: read

jobs:
  # ── Job 1: Auto-Format (runs only on direct push to develop) ───────────
  format:
    name: Auto-Format
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Ktlint Auto-Format
        run: ./gradlew ktlintFormat --no-daemon

      - name: Auto-Commit Formatted Code
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format code with ktlint [skip ci]"
          branch: ${{ github.ref_name }}
          file_pattern: "**/*.kt **/*.kts"

  # ── Job 2: Lint & Static Analysis ─────────────────────────────────────
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    if: always() && (needs.format.result == 'success' || needs.format.result == 'skipped')
    needs: [format]
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Ktlint Check & Detekt
        run: ./gradlew ktlintCheck detekt buildHealth --no-daemon

  # ── Job 3: Tests & Build (parallel with lint) ─────────────────────────
  verify:
    name: Verify Project (${{ matrix.task }})
    runs-on: ubuntu-latest
    if: always() && (needs.format.result == 'success' || needs.format.result == 'skipped')
    needs: [format]
    strategy:
      fail-fast: false
      matrix:
        task: [testDebugUnitTest, assembleDebug, apiCheck]
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run ${{ matrix.task }}
        run: ./gradlew ${{ matrix.task }} --no-daemon
