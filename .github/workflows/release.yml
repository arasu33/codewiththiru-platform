name: Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Job 1: Lint & Static Analysis (parallel) ──────────────────────────
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Ktlint & Detekt
        run: ./gradlew ktlintCheck detekt --no-daemon

  # ── Job 2: Unit Tests & API Checks (parallel) ─────────────────────────
  verify:
    name: Verify Project (${{ matrix.task }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [test, apiCheck]
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run ${{ matrix.task }}
        run: ./gradlew ${{ matrix.task }} --no-daemon

  # ── Job 3: Publish (depends on lint + test) ────────────────────────────
  publish:
    name: Publish Artifacts
    runs-on: ubuntu-latest
    needs: [lint, verify]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Assemble Release & Publish
        run: ./gradlew assembleRelease publish -PPLATFORM_VERSION_NAME=${GITHUB_REF_NAME#v} -x lintVitalRelease --max-workers=4 --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
